# 打 tag 自动构建发布：打包 zip + exe（SFX）→ 打产物来源证明 → 创建 GitHub Release
# 用法：git tag v0.2.0 && git push origin v0.2.0
name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v0.2.0）；留空则自动用最近 tag'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        id: ver
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              VER="${{ github.ref_name }}"
            else
              VER="$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.1.1')"
            fi
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "构建版本: $VER"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install 7-Zip CLI
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Prepare dist dir
        run: mkdir -p dist

      - name: Build zip (UTF-8 filenames)
        run: node scripts/make-release-zip.mjs "${{ steps.ver.outputs.version }}" "dist/NimuQDock-dsh-${{ steps.ver.outputs.version }}-win-x64.zip"

      - name: Build 7z archive (UTF-8 filenames, for SFX exe)
        run: node scripts/make-release-7z.mjs "${{ steps.ver.outputs.version }}" "dist/app.7z"

      - name: Build exe (7-Zip SFX)
        run: |
          cat scripts/sfx/7z.sfx scripts/sfx/sfx-config.txt "dist/app.7z" \
            > "dist/NimuQDock-dsh-${{ steps.ver.outputs.version }}-setup.exe"
          ls -la dist/

      - name: Attest build provenance (来源证明)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/*.zip
            dist/*.exe

      - name: Create or update GitHub Release
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION 已存在，补传 assets…"
            gh release upload "$VERSION" dist/*.zip dist/*.exe --clobber
          else
            gh release create "$VERSION" \
              "dist/NimuQDock-dsh-$VERSION-win-x64.zip" \
              "dist/NimuQDock-dsh-$VERSION-setup.exe" \
              --title "NimuQDock-dsh $VERSION" \
              --notes "自动构建发布（GitHub Actions）。安装说明见 README。"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
