# 打 tag 自动构建发布：打包 zip + exe（SFX）→ 打产物来源证明 → 创建 GitHub Release
# 用法：git tag v0.2.0 && git push origin v0.2.0
name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install 7-Zip CLI
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Prepare dist dir
        run: mkdir -p dist

      - name: Build zip (UTF-8 filenames)
        run: node scripts/make-release-zip.mjs "${{ github.ref_name }}" "dist/NimuQDock-dsh-${{ github.ref_name }}-win-x64.zip"

      - name: Build 7z archive (UTF-8 filenames, for SFX exe)
        run: node scripts/make-release-7z.mjs "${{ github.ref_name }}" "dist/app.7z"

      - name: Build exe (7-Zip SFX)
        run: |
          cat scripts/sfx/7z.sfx scripts/sfx/sfx-config.txt "dist/app.7z" \
            > "dist/NimuQDock-dsh-${{ github.ref_name }}-setup.exe"
          ls -la dist/

      - name: Attest build provenance (来源证明)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/*.zip
            dist/*.exe

      - name: Create or update GitHub Release
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} 已存在，补传 assets…"
            gh release upload "${{ github.ref_name }}" dist/*.zip dist/*.exe --clobber
          else
            gh release create "${{ github.ref_name }}" \
              "dist/NimuQDock-dsh-${{ github.ref_name }}-win-x64.zip" \
              "dist/NimuQDock-dsh-${{ github.ref_name }}-setup.exe" \
              --title "NimuQDock-dsh ${{ github.ref_name }}" \
              --notes "自动构建发布（GitHub Actions）。安装说明见 README。"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
