# 打 tag 自动构建发布：打包 zip + exe（SFX）→ 打产物来源证明 → 创建 GitHub Release
# 用法：git tag v0.2.0 && git push origin v0.2.0
name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v0.2.0）；留空则自动用最近 tag'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  attestations: write
  statuses: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        id: ver
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              VER="${{ github.ref_name }}"
            else
              VER="$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.1.1')"
            fi
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "构建版本: $VER"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install 7-Zip CLI
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Prepare dist dir
        run: mkdir -p dist

      # 内置便携 Node（Windows x64）：拷到仓库根 node/，打包 walk 会自动带上 → 任何电脑双击即可运行，无需预装 Node
      - name: Fetch portable Node (win-x64)
        run: |
          NODE_VER=v22.23.2
          curl -fsSL -o /tmp/node-win.zip "https://nodejs.org/dist/${NODE_VER}/node-${NODE_VER}-win-x64.zip"
          mkdir -p /tmp/node-x
          7z x -y -o/tmp/node-x /tmp/node-win.zip >/dev/null
          mv "/tmp/node-x/node-${NODE_VER}-win-x64" "${GITHUB_WORKSPACE}/node"
          ls "${GITHUB_WORKSPACE}/node/node.exe"
          echo "portable node ready"

      # 接话判断模型 + CPU 版 llama.cpp（合并进发行包，用户下载即用）
      - name: Fetch judge model (GGUF) and llama.cpp CPU build
        run: |
          set -o pipefail
          node scripts/fetch-judge-model.mjs --small 2>&1 | tee /tmp/fetch.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            MSG=$(grep -E "失败|ERROR|Error" /tmp/fetch.log | tail -2 | tr '\n' ' ' | cut -c1-120)
            gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
              -f state=failure -f context=fetch-judge -f description="$MSG" || true
            exit 1
          fi
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build zip (UTF-8 filenames)
        run: node scripts/make-release-zip.mjs "${{ steps.ver.outputs.version }}" "dist/NimuQDock-dsh-${{ steps.ver.outputs.version }}-win-x64.zip"

      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          makensis -VERSION

      - name: Build installer (NSIS native wizard)
        run: |
          node scripts/make-installer-nsis.mjs "${{ steps.ver.outputs.version }}" dist
          # 固定文件名副本：给用户一个不会随版本变化的下载直链
          cp "dist/NimuQDock-dsh-${{ steps.ver.outputs.version }}-setup.exe" "dist/NimuQDock-dsh-latest-setup.exe"
          ls -la dist/

      - name: Attest build provenance (来源证明)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/*.zip
            dist/*.exe

      - name: Extract changelog notes (from CHANGELOG.md)
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # 抽取 "## $VERSION" 标题到下一个小节前的正文作为 Release 备注；取不到则用通用文案兜底
          awk -v hdr="## $VERSION" '
            index($0, hdr) == 1 && $0 == hdr { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "本版本暂无独立更新日志条目（详见仓库 CHANGELOG.md）。" > /tmp/release-notes.md
          fi
          printf '%s\n' \
            '' '---' '' '### 下载' '' \
            '- **国内加速（推荐）**：https://gh-proxy.com/https://github.com/NimuStudio/NimuQDock-dsh/releases/latest/download/NimuQDock-dsh-latest-setup.exe' \
            '- **GitHub 原链**：https://github.com/NimuStudio/NimuQDock-dsh/releases/latest' \
            '- **zip 完整离线包**：见下方 Assets（内置 0.6B 判断模型，适合网络不好或想开箱即用）' \
            '' '> `...-latest-setup.exe` 是每次发版自动更新的固定文件名，链接不会过期。' \
            '> 安装器下载 NapCat / 推理引擎 / 判断模型时也会自动走国内镜像。' \
            >> /tmp/release-notes.md
          echo "notes 行数: $(wc -l < /tmp/release-notes.md)"

      - name: Create or update GitHub Release
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION 已存在，补传 assets + 更新备注…"
            gh release upload "$VERSION" dist/*.zip dist/*.exe "dist/NimuQDock-dsh-latest-setup.exe" --clobber
            gh release edit "$VERSION" --notes-file /tmp/release-notes.md
          else
            gh release create "$VERSION" \
              "dist/NimuQDock-dsh-$VERSION-win-x64.zip" \
              "dist/NimuQDock-dsh-$VERSION-setup.exe" \
              "dist/NimuQDock-dsh-latest-setup.exe" \
              --title "NimuQDock-dsh $VERSION" \
              --notes-file /tmp/release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
